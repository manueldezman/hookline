name: Docs impact

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: docs-impact-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    name: impact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      count: ${{ steps.impact.outputs.count }}
      pages: ${{ steps.impact.outputs.pages }}
    steps:
      - name: Check out the product
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect the changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          cat changed-files.txt

      - name: Check out the docs
        uses: actions/checkout@v4
        with:
          repository: manueldezman/hookline-docs
          ref: main
          path: docs-repo
          persist-credentials: false

      - name: Find the affected pages
        id: impact
        run: node scripts/docs-impact.mjs --changed-files changed-files.txt --docs docs-repo --json impact.json

      - name: Comment the docs impact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COUNT: ${{ steps.impact.outputs.count }}
          PAGES_JSON: ${{ steps.impact.outputs.pages }}
        run: |
          if [ "$COUNT" = "0" ]; then
            BODY=$(printf '%s\n' "<!-- docs-impact -->" "" "No docs page depends on the changed files.")
          else
            BULLETS=$(printf '%s\n' "$PAGES_JSON" | jq -r '.[] | "- `\(.file)` because `\(.reasons | join("`, `"))` changed."')
            BODY=$(printf '%s\n' "<!-- docs-impact -->" "" "This PR affects the docs pages listed below. The docs draft opens after merge." "" "$BULLETS")
          fi
          COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- docs-impact -->")) | .id' | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi

  draft:
    name: draft
    needs: impact
    if: github.event_name == 'push' && needs.impact.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the product
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the product reference
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "product_ref=pull request #${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "branch=docs/product-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "title=docs: update pages for product PR #${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "issue=Related to manueldezman/hookline#${PR_NUMBER}." >> "$GITHUB_OUTPUT"
          else
            SHORT="${GITHUB_SHA::7}"
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "product_ref=commit ${SHORT}" >> "$GITHUB_OUTPUT"
            echo "branch=docs/push-${SHORT}" >> "$GITHUB_OUTPUT"
            echo "title=docs: update pages for commit ${SHORT}" >> "$GITHUB_OUTPUT"
            echo "issue=Related to commit ${GITHUB_SHA}." >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the docs
        uses: actions/checkout@v4
        with:
          repository: manueldezman/hookline-docs
          ref: main
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: docs-repo

      - name: Prepare the docs checkout
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
          PRODUCT_REF: ${{ steps.ref.outputs.product_ref }}
          BRANCH: ${{ steps.ref.outputs.branch }}
          PAGES_JSON: ${{ needs.impact.outputs.pages }}
        run: |
          mkdir -p docs-repo/.docs-impact
          git diff "$BASE_SHA...$HEAD_SHA" > docs-repo/.docs-impact/product.diff
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > docs-repo/.docs-impact/changed-files.txt
          printf '%s\n' "$PAGES_JSON" > docs-repo/.docs-impact/pages.json
          sed "s|{{PRODUCT_REF}}|${PRODUCT_REF}|g" .github/docs-impact-prompt.md > docs-repo/.docs-impact/prompt.md
          echo ".docs-impact/" >> docs-repo/.git/info/exclude
          git -C docs-repo config user.name "github-actions[bot]"
          git -C docs-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C docs-repo checkout -B "$BRANCH"

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/v2/install | bash

      - name: Configure OpenCode
        run: |
          mkdir -p "$HOME/.config/opencode"
          printf '%s\n' '{
            "$schema": "https://opencode.ai/config.json",
            "model": "openrouter/baidu/ernie-5.5-flash-preview:free",
            "permissions": [
              { "action": "read", "resource": "*", "effect": "allow" },
              { "action": "edit", "resource": "*", "effect": "allow" },
              { "action": "glob", "resource": "*", "effect": "allow" },
              { "action": "grep", "resource": "*", "effect": "allow" },
              { "action": "shell", "resource": "*", "effect": "deny" },
              { "action": "external_directory", "resource": "*", "effect": "deny" },
              { "action": "webfetch", "resource": "*", "effect": "deny" },
              { "action": "websearch", "resource": "*", "effect": "deny" },
              { "action": "skill", "resource": "*", "effect": "deny" },
              { "action": "subagent", "resource": "*", "effect": "deny" },
              { "action": "question", "resource": "*", "effect": "deny" },
              { "action": "execute", "resource": "*", "effect": "deny" }
            ]
          }' > "$HOME/.config/opencode/opencode.json"

      - name: Run the docs agent
        working-directory: docs-repo
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENPROUTER_KEY }}
        run: |
          opencode run --standalone --auto \
            --model "openrouter/baidu/ernie-5.5-flash-preview:free" \
            "$(cat .docs-impact/prompt.md)"

      - name: Check the agent changes
        id: diff
        working-directory: docs-repo
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The agent made no docs changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git status --porcelain | grep -vE '^.. docs/'; then
            echo "The agent changed files outside docs/." >&2
            exit 1
          fi
          git diff --name-only -- docs > .docs-impact/changed-docs.txt
          git ls-files --others --exclude-standard -- docs >> .docs-impact/changed-docs.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-repo/package-lock.json

      - name: Install docs dependencies
        if: steps.diff.outputs.changed == 'true'
        working-directory: docs-repo
        run: npm ci

      - name: Install Vale
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v3.26.0/vale_3.26.0_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale

      - name: Install codespell
        if: steps.diff.outputs.changed == 'true'
        run: pip install codespell

      - name: Run the docs checks
        if: steps.diff.outputs.changed == 'true'
        working-directory: docs-repo
        run: |
          vale sync
          npm run check:api
          npm run check:frontmatter
          npm test
          vale docs
          codespell docs README.md
          npm run build
          npm run validate

      - name: Commit and push the docs branch
        if: steps.diff.outputs.changed == 'true'
        working-directory: docs-repo
        env:
          PRODUCT_REF: ${{ steps.ref.outputs.product_ref }}
          BRANCH: ${{ steps.ref.outputs.branch }}
        run: |
          git add docs
          git commit -m "Update docs for ${PRODUCT_REF}"
          git push --force origin "HEAD:${BRANCH}"

      - name: Open or update the docs pull request
        id: docs-pr
        if: steps.diff.outputs.changed == 'true'
        working-directory: docs-repo
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
          BRANCH: ${{ steps.ref.outputs.branch }}
          TITLE: ${{ steps.ref.outputs.title }}
          ISSUE: ${{ steps.ref.outputs.issue }}
          PRODUCT_REF: ${{ steps.ref.outputs.product_ref }}
          CHANGED_FILES: .docs-impact/changed-docs.txt
        run: |
          BULLETS=$(while IFS= read -r file; do
            if [ -z "$file" ]; then continue; fi
            printf -- '- Update [`%s`](https://github.com/manueldezman/hookline-docs/blob/%s/%s) because the product change makes it wrong.\n' "$file" "$BRANCH" "$file"
          done < "$CHANGED_FILES")
          BODY=$(cat <<EOF
          This PR updates the docs for the product change in ${PRODUCT_REF}.

          ## Because

          The product change makes the docs pages below wrong. The docs must match the product behavior.

          ## This PR

          ${BULLETS}

          ## Issue

          ${ISSUE}

          ## Additional Information

          This PR was drafted by the docs agent from the product diff. The docs checks and the code examples check must pass before merge.

          ## Pull Request Requirements

          - [x] The docs checks pass.
          - [ ] The code examples check passes on this PR.
          - [ ] The preview build is reviewed.
          - [ ] The docs match the product behavior.
          EOF
          )
          URL=$(gh pr list --repo manueldezman/hookline-docs --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -z "$URL" ]; then
            URL=$(gh pr create \
              --repo manueldezman/hookline-docs \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY")
          else
            gh pr edit "$URL" --title "$TITLE" --body "$BODY"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Docs pull request is at $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the docs pull request link
        if: steps.diff.outputs.changed == 'true' && steps.ref.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.ref.outputs.pr }}
          PAGES_JSON: ${{ needs.impact.outputs.pages }}
          DOCS_PR_URL: ${{ steps.docs-pr.outputs.url }}
        run: |
          BULLETS=$(printf '%s\n' "$PAGES_JSON" | jq -r '.[] | "- `\(.file)` because `\(.reasons | join("`, `"))` changed."')
          BODY=$(printf '%s\n' "<!-- docs-impact -->" "" "This PR affects the docs pages listed below. The docs draft is ready." "" "$BULLETS" "" "Docs pull request: $DOCS_PR_URL")
          COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- docs-impact -->")) | .id' | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi
